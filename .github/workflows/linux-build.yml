name: Linux Build

on:
  workflow_dispatch:

env:
  QT_VERSION: 6.5.0
  AQT_ARCH: gcc_64
  ARCHIVE_NAME: YaRXP-linux-amd64-latest

jobs:

  build:

    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:

    - uses: actions/checkout@v3

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libgl1-mesa-dev \
          libglu1-mesa-dev \
          libpulse-dev \
          libasound2-dev \
          libxcb-cursor0 \
          libxkbcommon-x11-0

    - name: Install aqtinstall
      run: pip install aqtinstall

    - name: Install Qt
      run: |
        aqt install-qt linux desktop $QT_VERSION $AQT_ARCH -m qtmultimedia -O $HOME/Qt

    - name: Run qmake
      run: |
        export PATH="$HOME/Qt/$QT_VERSION/$AQT_ARCH/bin:$PATH"
        qmake CONFIG+=release YaRXP.pro

    - name: Build
      run: make -j$(nproc)

    - name: List artifacts
      run: find build/release -type f

    - name: ZIP executable artifacts
      run: |
        zip -r "${ARCHIVE_NAME}.zip" build/release/

    - name: Upload executable artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.ARCHIVE_NAME }}
        path: ${{ env.ARCHIVE_NAME }}.zip

    - name: Publish release
      uses: "marvinpinto/action-automatic-releases@latest"
      with:
        repo_token: "${{ secrets.GITHUB_TOKEN }}"
        automatic_release_tag: "latest-linux"
        prerelease: true
        title: "Automatic Linux Build"
        files: |
          ${{ env.ARCHIVE_NAME }}.zip
